# CPU environment - works on any Windows, macOS or Linux machine.
# Create with:  conda env create -f crisismmd-cpu.yml
name: crisismmd-cpu
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
      - torch==2.5.1
      - torchvision==0.20.1
      - numpy==1.26.4
      - pandas==2.2.3
      - scikit-learn==1.5.2
      - matplotlib==3.9.2
      - pillow==11.0.0
      - requests==2.32.3
      - pyyaml==6.0.2
      - tqdm==4.67.1
      - codecarbon==2.8.2
      - psutil
      - jupyter
      - transformers==4.46.3
      - timm==1.0.11
